# Explicit development overlay. Production is the safe default:
#   docker compose up -d --build
# Development:
#   docker compose -f docker-compose.yml -f compose.dev.yml up --build
services:
  app:
    build:
      target: builder
    entrypoint: []
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:5173"
    environment:
      NODE_ENV: development
    healthcheck:
      disable: true
    volumes:
      - ./app/src:/app/src
      - uploads:/uploads

  worker:
    command: npm run dev
    volumes:
      - ./worker/src:/worker/src
      - uploads:/uploads

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  proxy:
    profiles:
      - production
